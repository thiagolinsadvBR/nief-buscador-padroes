<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogador Rápido IDV</title>
    <style>
        :root {
            --primary: #1a1a1a;
            --accent: #7CFC00;
            --text: #ffffff;
            --bg-card: #252525;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--primary);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            padding-top: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h2 {
            border-bottom: 2px solid var(--accent);
            padding-bottom: 5px;
            margin: 0 0 10px 0;
            display: inline-block;
        }

        .contador {
            color: var(--accent);
            font-weight: bold;
            font-size: 1.1rem;
        }

        /* Container principal com animações */
        .workspace {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 800px;
            transition: opacity 0.3s;
        }

        .foto-container {
            background-color: var(--bg-card);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #444;
            box-shadow: 0 15px 30px rgba(0,0,0,0.5);
            width: 90%;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 25px;
            /* Classes base para a animação */
            transform: translateX(0);
            opacity: 1;
        }

        .foto-container img {
            max-width: 100%;
            max-height: 50vh;
            object-fit: contain;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        /* Container para alinhar o chassi e o botão de copiar */
        .chassi-wrapper {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-top: 5px;
        }

        .chassi-atual {
            font-size: 1.8rem;
            font-weight: bold;
            color: white;
            letter-spacing: 2px;
            margin: 0;
        }

        /* Botão de Copiar Numeração */
        .btn-copiar {
            background-color: #333;
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 8px 15px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-copiar:hover {
            background-color: var(--accent);
            color: var(--primary);
        }

        /* Classes de Animação CSS */
        .slide-out-left {
            animation: slideOutLeft 0.3s forwards cubic-bezier(0.4, 0, 0.2, 1);
        }
        .slide-in-right {
            animation: slideInRight 0.3s forwards cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes slideOutLeft {
            to { transform: translateX(-150%); opacity: 0; }
        }
        @keyframes slideInRight {
            from { transform: translateX(150%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* Formulário */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
            width: 90%;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 15px;
            font-size: 1.1rem;
            border-radius: 8px;
            border: 2px solid #444;
            background: #222;
            color: white;
            box-sizing: border-box;
            text-align: center;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
        }
        
        /* Destaque visual quando o ano for preenchido automaticamente */
        .ano-auto {
            border-color: var(--accent) !important;
            box-shadow: 0 0 10px rgba(124, 252, 0, 0.3);
        }

        .botoes {
            display: flex;
            gap: 20px;
            width: 90%;
        }

        button.btn-ignorar, button.btn-salvar {
            flex: 1;
            padding: 15px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            border: none;
        }

        .btn-salvar {
            background-color: var(--accent);
            color: var(--primary);
        }

        .btn-salvar:hover {
            background-color: #65d100;
            transform: translateY(-2px);
        }

        .btn-ignorar {
            background-color: #444;
            color: white;
        }

        .btn-ignorar:hover {
            background-color: #555;
            transform: translateY(-2px);
        }

        .tela-vazia {
            display: none;
            text-align: center;
            margin-top: 20vh;
        }
        
        .tela-vazia h1 { color: var(--accent); }
    </style>
</head>
<body>

    <div class="header">
        <h2>Catalogador Rápido</h2>
        <div class="contador" id="txtContador">Carregando fila...</div>
    </div>

    <div class="workspace" id="workspace">
        <div class="foto-container" id="fotoContainer">
            <img id="imgAtual" src="" alt="Foto IDV">
            <div class="chassi-wrapper">
                <h3 class="chassi-atual" id="txtChassi"></h3>
                <button class="btn-copiar" id="btnCopiar" onclick="copiarNum()">📋 Copiar</button>
            </div>
        </div>

        <div class="form-grid">
            <input type="text" id="inMarca" placeholder="Marca (Ex: Honda)">
            <input type="text" id="inModelo" placeholder="Modelo (Ex: Titan)">
            <input type="text" id="inAno" placeholder="Ano (Ex: 2020)">
        </div>

        <div class="botoes">
            <button class="btn-ignorar" onclick="processarArquivo(true)">Pular / Não Renomear</button>
            <button class="btn-salvar" onclick="processarArquivo(false)">Salvar (Enter)</button>
        </div>
    </div>

    <div class="tela-vazia" id="telaVazia">
        <h1>🎉 Tudo Concluído!</h1>
        <p>Não há mais arquivos pendentes de renomeação nesta pasta.</p>
    </div>

    <script>
        let filaArquivos = [];
        let arquivoAtual = null;

        const fotoContainer = document.getElementById('fotoContainer');
        const imgAtual = document.getElementById('imgAtual');
        const txtChassi = document.getElementById('txtChassi');
        const inMarca = document.getElementById('inMarca');
        const inModelo = document.getElementById('inModelo');
        const inAno = document.getElementById('inAno');
        const workspace = document.getElementById('workspace');
        const telaVazia = document.getElementById('telaVazia');
        const txtContador = document.getElementById('txtContador');

        // Lógica para auto-divisão de Marca e Modelo ao colar texto
        inMarca.addEventListener('input', function() {
            const texto = this.value;
            if (texto.includes('/')) {
                const partes = texto.split('/');
                this.value = partes[0].trim(); // Define a Marca
                
                // Pega tudo após a primeira barra e coloca no Modelo
                const restante = partes.slice(1).join('/').trim();
                if (restante) {
                    inModelo.value = restante;
                    // Foca direto no campo Ano para acelerar o processo
                    inAno.focus();
                } else {
                    inModelo.focus();
                }
            }
        });

        // Lógica Forense de Decodificação do Ano (Padrão VIN - Tabela Oficial)
        function decodificarAnoVIN(chassi) {
            // Remove possíveis espaços vazios nas extremidades
            chassi = chassi.trim();

            // Se o código tiver menos de 17 caracteres, aborta o autopreenchimento
            if (chassi.length < 17) return "";
            
            // Pega exatamente a 10ª posição (índice 9), desconsiderando qualquer texto a mais
            const pos10 = chassi.charAt(9).toUpperCase();
            
            // Mapeamento exato baseado no 10º dígito, priorizando a frota atual (2001-2030)
            const mapaAnos = {
                '1': "2001", '2': "2002", '3': "2003", '4': "2004", '5': "2005",
                '6': "2006", '7': "2007", '8': "2008", '9': "2009",
                'A': "2010", 'B': "2011", 'C': "2012", 'D': "2013", 'E': "2014",
                'F': "2015", 'G': "2016", 'H': "2017", 'J': "2018", 'K': "2019",
                'L': "2020", 'M': "2021", 'N': "2022", 'P': "2023", 'R': "2024",
                'S': "2025", 'T': "2026", 'V': "2027", 'W': "2028", 'X': "2029",
                'Y': "2030"
            };

            return mapaAnos[pos10] || "";
        }

        // Carrega a lista de arquivos pendentes ao abrir
        async function carregarFila() {
            try {
                const response = await fetch('/api/pendentes');
                filaArquivos = await response.json();
                atualizarInterface();
            } catch (error) {
                alert("Erro ao conectar com o servidor Python.");
            }
        }

        function atualizarInterface() {
            if (filaArquivos.length === 0) {
                workspace.style.display = 'none';
                telaVazia.style.display = 'block';
                txtContador.innerText = "Fila zerada";
                return;
            }

            arquivoAtual = filaArquivos[0];
            txtContador.innerText = `${filaArquivos.length} arquivos restantes`;
            
            // Remove a extensão para exibir só a numeração
            const chassiPuro = arquivoAtual.split('.').slice(0, -1).join('.');
            txtChassi.innerText = chassiPuro;
            
            // Força o recarregamento da imagem para evitar cache
            imgAtual.src = `/fotos/${arquivoAtual}?t=${new Date().getTime()}`;

            // Limpa os campos
            inMarca.value = "";
            inModelo.value = "";
            inAno.value = "";
            inAno.classList.remove('ano-auto');
            
            // Tenta decodificar o ano automaticamente
            const anoDecodificado = decodificarAnoVIN(chassiPuro);
            if (anoDecodificado) {
                inAno.value = anoDecodificado;
                inAno.classList.add('ano-auto'); // Efeito visual de sucesso
            }

            // Foca na Marca
            inMarca.focus();
        }

        // Função para copiar a numeração com validação de 17 caracteres
        async function copiarNum() {
            const btn = document.getElementById('btnCopiar');
            let num = txtChassi.innerText.trim();
            
            if (num.length < 17) {
                alert("A numeração possui menos de 17 caracteres e não foi copiada.");
                return;
            }
            
            // Recorta para copiar apenas os 17 primeiros caracteres
            num = num.substring(0, 17);
            
            const originalText = btn.innerHTML;
            
            try {
                await navigator.clipboard.writeText(num);
                btn.innerHTML = "✅ Copiado!";
                setTimeout(() => {
                    btn.innerHTML = originalText;
                }, 1500);
            } catch (e) {
                alert("Erro ao copiar a numeração.");
            }
        }

        async function processarArquivo(ignorar = false) {
            if (!arquivoAtual) return;

            const marca = inMarca.value.trim();
            const modelo = inModelo.value.trim();
            const ano = inAno.value.trim();

            if (!ignorar && (!marca || !modelo || !ano)) {
                alert("Preencha todos os campos para salvar, ou clique em Pular.");
                return;
            }

            const payload = {
                antigo: arquivoAtual,
                ignorar: ignorar,
                marca: marca,
                modelo: modelo,
                ano: ano
            };

            try {
                const response = await fetch('/api/salvar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                if (result.status === "sucesso") {
                    animarTrocaDeFoto();
                } else {
                    alert("Erro ao renomear: " + result.msg);
                }
            } catch (error) {
                alert("Erro de comunicação com o servidor.");
            }
        }

        function animarTrocaDeFoto() {
            // Inicia a animação saindo pela esquerda
            fotoContainer.classList.remove('slide-in-right');
            fotoContainer.classList.add('slide-out-left');

            // Aguarda o fim da animação (300ms definido no CSS)
            setTimeout(() => {
                // Remove o arquivo salvo da fila interna
                filaArquivos.shift();
                
                // Prepara a próxima foto invisivelmente
                atualizarInterface();
                
                if (filaArquivos.length > 0) {
                    // Puxa a nova foto pela direita
                    fotoContainer.classList.remove('slide-out-left');
                    fotoContainer.classList.add('slide-in-right');
                }
            }, 300);
        }

        // Sistema de atalhos pelo teclado (Enter)
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                if (document.activeElement === inMarca) {
                    inModelo.focus();
                } else if (document.activeElement === inModelo) {
                    inAno.focus();
                } else if (document.activeElement === inAno) {
                    processarArquivo(false);
                }
            }
        });

        // Inicia o programa
        carregarFila();
    </script>
</body>
</html>
